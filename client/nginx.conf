server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest — зөв MIME type
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service worker — кэшлэхгүй (шинэ хувилбар тэр даруй идэвхжинэ)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # Апп /nous/ дэд замтай build хийгдсэн: шууд хандахад (gateway-гүйгээр) ч ажиллуулахын тулд
    # /nous/ угтварыг хасаж дотроо дахин боловсруулна. Gateway өөрөө аль хэдийн хасаад дамжуулдаг.
    # $request_uri нь rewrite хийсний дараа ч анхны замаа хадгалдаг: зөвхөн жинхэнэ "/" хүсэлтийг redirect хийнэ
    # (/nous/ -> rewrite -> / үед давталт үүсэхээс сэргийлнэ).
    location = / {
        if ($request_uri = "/") { return 302 /nous/; }
        try_files /index.html =404;
    }
    location ^~ /nous/ { rewrite ^/nous/(.*)$ /$1 last; }
    location = /nous { return 302 /nous/; }

    # SPA — бүх route-ыг index.html руу буцаана (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API-г backend (server container) руу дамжуулна
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload хийсэн зургууд — server-ийн статик файлууд руу дамжуулна
    location /uploads/ {
        # URL-д зургийн token (?t=) байдаг тул access log-д бичихгүй.
        access_log off;
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — websocket upgrade-тэйгээр дамжуулна
    location /socket.io/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
