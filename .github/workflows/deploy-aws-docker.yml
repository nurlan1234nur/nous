name: Deploy AWS Docker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: nurlannn
  SERVER_IMAGE: love-server
  CLIENT_IMAGE: love-client

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npm run typecheck
        working-directory: server

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.SERVER_IMAGE }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.CLIENT_IMAGE }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.CLIENT_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy production compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.SERVER_USER }}/nous
          overwrite: true

      - name: Start Nous on port 8300
        uses: appleboy/ssh-action@v1.2.2
        env:
          SUDO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          envs: SUDO_PASSWORD
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/nous
            if [ ! -s .env ]; then
              umask 077
              printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
            fi
            export VERSION=${{ github.sha }}
            export NOUS_HTTP_PORT=8300
            export CLIENT_ORIGIN=http://${{ secrets.SERVER_HOST }}:8300
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8300/api/health >/dev/null; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S ufw allow 8300/tcp
                docker compose -f docker-compose.prod.yml ps
                exit 0
              fi
              sleep 5
            done
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=100
            exit 1
